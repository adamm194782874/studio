<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Baden Barbell</title>
  <meta name="description" content="Personal workout log">
  <meta name="theme-color" content="#07080f">
  <script>try{var t=(JSON.parse(localStorage.getItem('badenBarbell.v1'))||{}).theme;if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baden Barbell">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-day="sun">
  <div class="glow" aria-hidden="true"></div>
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <h1>Baden Barbell</h1>
      </div>
      <nav class="tabs" aria-label="Main">
        <button class="tab on" data-act="tab" data-tab="train">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>
          <span>Train</span>
        </button>
        <button class="tab" data-act="tab" data-tab="progress">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Progress</span>
        </button>
        <button class="tab" data-act="tab" data-tab="setup">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
          <span>Setup</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section id="train" class="view"></section>
    <section id="progress" class="view" hidden></section>
    <section id="setup" class="view" hidden></section>
  </main>

  <dialog id="sheet" class="sheet" aria-label="Choose exercise"></dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
