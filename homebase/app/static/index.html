<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Homebase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <meta name="apple-mobile-web-app-title" content="Homebase">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#7c3aed">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    </div>
    <div class="brand">
      <h1 id="appName">Homebase</h1>
      <div class="status"><span class="dot" id="aiDot"></span><span id="aiText">Checking AI...</span></div>
    </div>
  </header>

  <main id="main">
    <section class="view active" id="view-chat">
      <div id="messages"></div>
    </section>

    <section class="view" id="view-bills">
      <div class="page-title">Bills</div>
      <div class="stats" id="billStats"></div>
      <div class="bills-bar">
        <div class="seg">
          <button data-bills="unpaid" class="on">Unpaid</button>
          <button data-bills="paid">Paid</button>
          <button data-bills="all">All</button>
        </div>
        <span class="spacer"></span>
        <button class="btn small" id="scanBills">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m4 7 8 6 8-6"/></svg>
          <span>Check email</span>
        </button>
      </div>
      <div id="billList"></div>
    </section>

    <section class="view" id="view-settings">
      <div class="page-title">Settings</div>
      <div class="card">
        <div class="card-head">
          <div class="ic c-violet" style="background:var(--violet-soft);color:var(--violet)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          </div>
          <div><h2>Your account</h2><div class="muted" id="whoami"></div></div>
        </div>
        <div class="row">
          <button class="btn small ghost" id="clearChat">Clear chat history</button>
          <button class="btn small ghost" id="logout">Sign out</button>
        </div>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="ic" style="background:var(--pink-soft);color:var(--pink)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          </div>
          <div><h2>Google Calendar and Gmail</h2><div class="muted" id="googleStatus"></div></div>
        </div>
        <div class="row" id="googleButtons"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="ic" style="background:var(--green-soft);color:var(--green)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M15 14.5a5 5 0 0 1 6.5 5"/></svg>
          </div>
          <h2>Household</h2>
        </div>
        <div id="householdList"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="ic" style="background:var(--amber-soft);color:var(--amber)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
          </div>
          <div><h2>AI model</h2><div class="muted" id="ollamaStatus">Checking...</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head">
          <div class="ic" style="background:var(--blue-soft);color:var(--blue)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </div>
          <div><h2>NAS file index</h2><div class="muted" id="indexStatus">Checking...</div></div>
        </div>
        <button class="btn small ghost" id="reindex">Re-index now</button>
      </div>
    </section>
  </main>

  <form class="composer" id="composer">
    <div class="field">
      <textarea id="input" rows="1" placeholder="Ask about files, plans or bills..." autocomplete="off"></textarea>
    </div>
    <button class="send" id="send" type="submit" aria-label="Send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>

  <nav class="tabbar">
    <button data-view="chat" class="active">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/></svg></span>
      Chat
    </button>
    <button data-view="bills">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h3"/></svg></span>
      Bills
    </button>
    <button data-view="settings">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>
      Settings
    </button>
  </nav>
</div>
<script src="/static/app.js"></script>
</body>
</html>
