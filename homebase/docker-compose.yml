# Container Manager > Project > Create, point it at this folder.
services:
  homebase:
    build: .
    image: homebase:latest
    container_name: homebase
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - settings.env
    volumes:
      # App data: database, settings, Google key. Keep this.
      - ./data:/data
      # Your NAS folders, read only. Left side is the NAS path, right side must start with /nas.
      # Add or remove lines to match your shared folders.
      - /volume1/Documents:/nas/Documents:ro
      - /volume1/homes:/nas/homes:ro
    mem_limit: 768m
